<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Christin — Muscle Rebuild HQ</title>
  <style>
    :root {
      --bg:#f7f7f5; --card:#fff; --text:#171717; --muted:#6b6b6b;
      --border:#deded8; --accent:#b8ff00; --accent-dark:#1b2500;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg); color:var(--text);
    }
    .app { max-width:760px; margin:auto; padding:24px 16px 48px; }
    header { display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin-bottom:20px; }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:4px; font-size:28px; }
    .muted { color:var(--muted); }
    .eyebrow { font-size:12px; letter-spacing:.08em; font-weight:700; color:var(--muted); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; }
    nav { display:flex; gap:8px; overflow:auto; margin-bottom:14px; padding-bottom:3px; }
    nav button, select, input, textarea {
      font:inherit; border:1px solid var(--border); border-radius:12px; background:#fff;
    }
    nav button { padding:10px 14px; white-space:nowrap; cursor:pointer; }
    nav button.active { background:var(--accent); color:#111; border-color:var(--accent); font-weight:700; }
    select,input,textarea { width:100%; padding:10px 12px; }
    button.primary { background:var(--accent); color:#111; border:0; border-radius:12px; padding:11px 15px; font-weight:800; cursor:pointer; }
    button.secondary { background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px 14px; cursor:pointer; }
    .day-row { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:16px; }
    .exercise { border-top:1px solid var(--border); padding:15px 0; }
    .exercise:first-child { border-top:0; }
    .exercise-title { font-weight:750; margin-bottom:4px; }
    .meta { font-size:13px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
    label { font-size:13px; color:var(--muted); display:block; }
    label input, label textarea { margin-top:5px; color:var(--text); }
    .hidden { display:none !important; }
    .stat { background:#fafaf8; border:1px solid var(--border); border-radius:14px; padding:12px; }
    .stat strong { display:block; font-size:19px; margin-top:3px; }
    .check { display:flex; gap:10px; align-items:center; padding:11px 0; border-top:1px solid var(--border); }
    .check input { width:auto; }
    @media(max-width:560px) {
      header { align-items:stretch; flex-direction:column; }
      h1 { font-size:24px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow">12-WEEK REBUILD · WEEK <span id="weekNumber">1</span></div>
      <h1>Christin’s Muscle Rebuild HQ</h1>
      <p class="muted">You are the client. The app does the thinking.</p>
    </div>
    <button class="primary" id="weekBtn">Advance Week</button>
  </header>

  <nav>
    <button class="active" data-tab="today">Today</button>
    <button data-tab="progress">Progress</button>
    <button data-tab="nutrition">Nutrition</button>
    <button data-tab="checkin">Check-in</button>
  </nav>

  <main>
    <section id="today"></section>
    <section id="progress" class="hidden"></section>
    <section id="nutrition" class="hidden"></section>
    <section id="checkin" class="hidden"></section>
  </main>
</div>

<script>
const STORAGE_KEY = "christin-muscle-rebuild-hq-v1";

const program = {
  Monday: {
    title:"Glutes + Hamstrings",
    note:"7-minute warm-up. Ramp up gradually on hip thrust.",
    exercises:[
      ["Barbell Hip Thrust","4","6–8","2–3 min","2"],
      ["Romanian Deadlift","3","8–10","2 min","2"],
      ["Step-Up","3","8–10 / leg","90 sec","2"],
      ["Seated Leg Curl","3","10–12","75 sec","1–2"],
      ["Cable Kickback","2","12–15 / side","45–60 sec","1–2"],
      ["Hip Abduction","3","15–20","45–60 sec","1–2"],
      ["Incline Treadmill","1","8 min","—","moderate"]
    ]
  },
  Tuesday: {
    title:"Back + Shoulders + Arms",
    note:"Brief warm-up and ramp-up sets.",
    exercises:[
      ["Lat Pulldown","3","8–10","90 sec","2"],
      ["Chest-Supported Row","3","8–10","90 sec","2"],
      ["Single-Arm Cable Row","2","10–12 / side","75 sec","2"],
      ["Lateral Raise","3","12–20","60 sec","1–2"],
      ["Rear-Delt Fly","3","12–20","60 sec","1–2"],
      ["Triceps Pressdown","3","10–15","60 sec","1–2"],
      ["Incline DB Curl","3","10–15","60 sec","1–2"],
      ["Bike / Treadmill","1","10 min","—","moderate"]
    ]
  },
  Wednesday: {
    title:"Recovery + Steps",
    note:"No lifting.",
    exercises:[
      ["Daily Steps","1","5,500–6,000","—","easy"],
      ["Optional Walk","1","20–30 min","—","easy"]
    ]
  },
  Thursday: {
    title:"Quads + Glutes",
    note:"Warm up. If squats feel wrong, use leg press.",
    exercises:[
      ["Back Squat OR Leg Press","4","6–8","2–3 min","2"],
      ["Leg Press","3","10–12","2 min","2"],
      ["Reverse Lunge","3","8–10 / side","90 sec","2"],
      ["Leg Extension","3","10–15","60–75 sec","1–2"],
      ["Hip Thrust","3","8–12","90 sec","2"],
      ["Hip Abduction","3","15–20","45–60 sec","1–2"],
      ["Incline Walk","1","8 min","—","moderate"]
    ]
  },
  Friday: {
    title:"Upper + Glute Accessory",
    note:"Brief upper-body warm-up and ramp-up set.",
    exercises:[
      ["Incline DB Press","3","8–10","90 sec","2"],
      ["Neutral-Grip Pulldown","3","8–12","90 sec","2"],
      ["Seated Cable Row","3","10–12","75–90 sec","2"],
      ["DB Shoulder Press","3","8–10","90 sec","2"],
      ["Lateral Raise","3","15–20","60 sec","1–2"],
      ["Triceps Pressdown","3","10–15","60 sec","1–2"],
      ["DB Curl","3","10–15","60 sec","1–2"],
      ["Cable Kickback","3","12–15 / side","45–60 sec","1–2"],
      ["Hip Abduction","3","15–20","45–60 sec","1–2"],
      ["Easy Cardio","1","10 min","—","moderate"]
    ]
  },
  Saturday: {
    title:"Cardio + Walking",
    note:"Choose a modality you tolerate well.",
    exercises:[
      ["Incline Treadmill / Bike / Elliptical / Brisk Walk","1","20–25 min","—","moderate"],
      ["Daily Steps","1","~6,000","—","easy"]
    ]
  },
  Sunday: {
    title:"Rest",
    note:"Actual rest. Normal movement is fine.",
    exercises:[]
  }
};

const days = Object.keys(program);
const nowDay = new Intl.DateTimeFormat("en-US",{weekday:"long"}).format(new Date());

let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
state.week ??= 1;
state.day ??= program[nowDay] ? nowDay : "Monday";
state.logs ??= {};
state.notes ??= {};
state.food ??= [];
state.checkins ??= {};
state.measurements ??= [];
save();

function save(){ localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function renderToday(){
  const d = program[state.day];
  document.getElementById("today").innerHTML = `
    <div class="card">
      <div class="day-row">
        <div>
          <div class="eyebrow">${esc(state.day)}</div>
          <h2>${esc(d.title)}</h2>
          <p class="muted">${esc(d.note)}</p>
        </div>
        <select id="daySelect" style="max-width:180px">
          ${days.map(x=>`<option ${x===state.day?"selected":""}>${x}</option>`).join("")}
        </select>
      </div>
      ${d.exercises.map((x,i)=>{
        const id=`${state.week}-${state.day}-${i}`;
        const l=state.logs[id]||{};
        return `
        <div class="exercise">
          <div class="exercise-title">${i+1}. ${esc(x[0])}</div>
          <div class="meta">${x[1]} set(s) · ${x[2]} · Rest ${x[3]} · RIR ${x[4]}</div>
          <div class="grid" style="margin-top:9px">
            <label>Load
              <input data-id="${id}" data-key="load" class="log" value="${esc(l.load)}" placeholder="lb / BW">
            </label>
            <label>Reps / Result
              <input data-id="${id}" data-key="reps" class="log" value="${esc(l.reps)}" placeholder="8, 8, 7">
            </label>
          </div>
        </div>`;
      }).join("")}
      <label style="margin-top:12px">Coach Notes
        <textarea id="notes" rows="4" placeholder="How did it feel? Anything to know for next week?">${esc(state.notes[`${state.week}-${state.day}`])}</textarea>
      </label>
      <button class="primary" id="saveWorkout" style="margin-top:10px;width:100%">Save Workout + Notes</button>
    </div>`;

  document.getElementById("daySelect").onchange=e=>{state.day=e.target.value;save();renderToday();};
  document.querySelectorAll(".log").forEach(el=>{
    el.oninput=()=>{
      state.logs[el.dataset.id] ??= {};
      state.logs[el.dataset.id][el.dataset.key]=el.value;
      save();
    };
  });
  document.getElementById("saveWorkout").onclick=()=>{
    state.notes[`${state.week}-${state.day}`]=document.getElementById("notes").value;
    save();
    document.getElementById("saveWorkout").textContent="Saved";
    setTimeout(()=>document.getElementById("saveWorkout").textContent="Save Workout + Notes",900);
  };
}

function renderProgress(){
  const dates=Object.keys(state.checkins).sort().reverse();
  const recent=dates.slice(0,8).map(d=>{
    const x=state.checkins[d];
    return `<div class="check"><strong>${d}</strong><span class="muted">${x.weight||"—"} lb · ${x.steps||"—"} steps · energy ${x.energy||"—"}/10</span></div>`;
  }).join("") || `<p class="muted">Your check-ins will appear here.</p>`;

  document.getElementById("progress").innerHTML=`
    <div class="card">
      <div class="eyebrow">12-WEEK PROGRAM</div>
      <h2>Week ${state.week} of 12</h2>
      <div class="grid">
        <div class="stat"><span class="muted">Starting weight</span><strong>164.5 lb</strong></div>
        <div class="stat"><span class="muted">Body fat</span><strong>38.9%</strong></div>
        <div class="stat"><span class="muted">Lean mass</span><strong>100.4 lb</strong></div>
        <div class="stat"><span class="muted">Protein</span><strong>125–135 g</strong></div>
        <div class="stat"><span class="muted">Steps</span><strong>5,500–6,000</strong></div>
        <div class="stat"><span class="muted">Lifting</span><strong>4 days</strong></div>
      </div>
      <div style="margin-top:18px;padding-top:15px;border-top:1px solid var(--border)">
        <div class="eyebrow">BASELINE · SEPTEMBER 23, 2026</div>
        <p class="muted" style="margin:6px 0 0">
          164.5 lb · 38.9% body fat · 64.0 lb fat mass · 100.4 lb lean body mass ·
          33.6% skeletal muscle
        </p>
        <p class="muted" style="margin:8px 0 0;font-size:13px">
          Goal: body recomposition. Track strength, measurements, photos, recovery and body changes—not the scale alone.
        </p>
      </div>
      <h3 style="margin-top:20px">Recent Check-ins</h3>
      ${recent}
    </div>
    <div class="card">
      <h3>4-Week Progress Photo Check</h3>
      <p class="muted">Front · side · back. Same lighting, distance and conditions.</p>
      <label>Photo date<input type="date" id="photoDate"></label>
      <button class="primary" id="photoDone" style="margin-top:10px">Mark Photo Check Complete</button>
      <p id="photoMessage" class="muted" style="margin-top:8px"></p>
    </div>`;
  document.getElementById("photoDone").onclick=()=>{
    document.getElementById("photoMessage").textContent="Photo check recorded.";
  };
}

function renderNutrition(){
  const totals=state.food.reduce((a,f)=>({
    c:a.c+Number(f.c||0),p:a.p+Number(f.p||0),car:a.car+Number(f.car||0),fat:a.fat+Number(f.fat||0)
  }),{c:0,p:0,car:0,fat:0});

  document.getElementById("nutrition").innerHTML=`
    <div class="card">
      <div class="eyebrow">DAILY TARGET</div>
      <h2>Nutrition</h2>
      <p class="muted">Starting range: 1,700–1,800 kcal · Protein 125–135 g</p>
      <div class="grid">
        <div class="stat"><span class="muted">Calories</span><strong>${Math.round(totals.c)}</strong></div>
        <div class="stat"><span class="muted">Protein</span><strong>${Math.round(totals.p)} g</strong></div>
        <div class="stat"><span class="muted">Carbs</span><strong>${Math.round(totals.car)} g</strong></div>
        <div class="stat"><span class="muted">Fat</span><strong>${Math.round(totals.fat)} g</strong></div>
      </div>
      <form id="foodForm" class="grid" style="margin-top:16px">
        <label>Food / Meal<input id="foodName" required></label>
        <label>Calories<input id="foodCal" type="number" min="0" required></label>
        <label>Protein<input id="foodPro" type="number" min="0" step=".1" required></label>
        <label>Carbs<input id="foodCarb" type="number" min="0" step=".1"></label>
        <label>Fat<input id="foodFat" type="number" min="0" step=".1"></label>
        <div style="display:flex;align-items:end"><button class="primary" type="submit" style="width:100%">Add Food</button></div>
      </form>
      <div style="margin-top:14px">
        ${state.food.map((f,i)=>`
          <div class="check">
            <strong>${esc(f.name)}</strong>
            <span class="muted">${f.c} kcal · ${f.p}g P · <button class="secondary removeFood" data-i="${i}">Remove</button></span>
          </div>`).join("") || `<p class="muted">Nothing logged yet.</p>`}
      </div>
    </div>`;

  document.getElementById("foodForm").onsubmit=e=>{
    e.preventDefault();
    state.food.push({
      name:document.getElementById("foodName").value.trim(),
      c:document.getElementById("foodCal").value,
      p:document.getElementById("foodPro").value,
      car:document.getElementById("foodCarb").value||0,
      fat:document.getElementById("foodFat").value||0
    });
    save(); renderNutrition();
  };
  document.querySelectorAll(".removeFood").forEach(b=>b.onclick=()=>{
    state.food.splice(Number(b.dataset.i),1);save();renderNutrition();
  });
}

function renderCheckin(){
  const d=state.checkins[todayKey()]||{};
  document.getElementById("checkin").innerHTML=`
    <div class="card">
      <div class="eyebrow">TODAY</div>
      <h2>Daily Check-in</h2>
      <p class="muted">Information, not judgment.</p>
      <div class="grid">
        <label>Morning Weight<input id="weight" type="number" step=".1" value="${esc(d.weight)}" placeholder="lb"></label>
        <label>Steps<input id="steps" type="number" value="${esc(d.steps)}"></label>
        <label>Energy<input id="energy" type="number" min="1" max="10" value="${esc(d.energy)}" placeholder="1–10"></label>
        <label>Recovery<input id="recovery" type="number" min="1" max="10" value="${esc(d.recovery)}" placeholder="1–10"></label>
        <label>Hunger<input id="hunger" type="number" min="1" max="10" value="${esc(d.hunger)}" placeholder="1–10"></label>
        <label>Resting HR<input id="hr" type="number" min="30" max="180" value="${esc(d.hr)}" placeholder="bpm"></label>
      </div>
      <button class="primary" id="saveCheckin" style="width:100%;margin-top:14px">Save Check-in</button>
      <p id="checkinMessage" class="muted"></p>
    </div>
    <div class="card">
      <h3>Measurements</h3>
      <p class="muted">Take these every 4 weeks.</p>
      <div class="grid">
        <label>Waist<input id="waist" type="number" step=".1" placeholder="in"></label>
        <label>Hips<input id="hips" type="number" step=".1" placeholder="in"></label>
        <label>Thigh<input id="thigh" type="number" step=".1" placeholder="in"></label>
        <label>Arm<input id="arm" type="number" step=".1" placeholder="in"></label>
      </div>
      <button class="primary" id="saveMeasurements" style="width:100%;margin-top:14px">Save Measurements</button>
      <p id="measurementMessage" class="muted"></p>
    </div>`;

  document.getElementById("saveCheckin").onclick=()=>{
    state.checkins[todayKey()]={
      weight:document.getElementById("weight").value,
      steps:document.getElementById("steps").value,
      energy:document.getElementById("energy").value,
      recovery:document.getElementById("recovery").value,
      hunger:document.getElementById("hunger").value,
      hr:document.getElementById("hr").value
    };
    save();document.getElementById("checkinMessage").textContent="Saved.";
  };
  document.getElementById("saveMeasurements").onclick=()=>{
    state.measurements.push({
      date:todayKey(),
      waist:document.getElementById("waist").value,
      hips:document.getElementById("hips").value,
      thigh:document.getElementById("thigh").value,
      arm:document.getElementById("arm").value
    });
    save();document.getElementById("measurementMessage").textContent="Measurements saved.";
  };
}

function showTab(tab){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  ["today","progress","nutrition","checkin"].forEach(id=>document.getElementById(id).classList.toggle("hidden",id!==tab));
  if(tab==="today")renderToday();
  if(tab==="progress")renderProgress();
  if(tab==="nutrition")renderNutrition();
  if(tab==="checkin")renderCheckin();
}

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

document.getElementById("weekBtn").onclick=()=>{
  if(state.week<12){state.week++;save();}
  document.getElementById("weekNumber").textContent=state.week;
  renderToday();
};

document.getElementById("weekNumber").textContent=state.week;
renderToday();
</script>
</body>
</html>
